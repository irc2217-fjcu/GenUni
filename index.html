                    });

                        .force("link", d3.forceLink(safeLinks).id(d => d.id).distance(220))
                        .force("charge", d3.forceManyBody().strength(-2800))
                        .force("center", d3.forceCenter(width * (isSidebarOpen ? 0.62 : 0.5), height / 2))

                    simRef.current = simulation;

                    const link = g.append("g").selectAll("line")
                        .data(safeLinks)
                        .join("line")
                        .attr("stroke", "#cbd5e1")
                        .attr("stroke-opacity", 0.75)
                        .attr("stroke-width", 1.5)
                        .style("transition", "opacity 0.4s ease");
                    linkSelectionRef.current = link;

                        .style("transition", "opacity 0.4s ease")
                        .call(d3.drag()

                                if (!e.active) simulation.alphaTarget(0.3).restart(); 
                                d.fx = d.x; d.fy = d.y; 
                            })
                            .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
                            .on("end", (e, d) => { 
                                if (!e.active) simulation.alphaTarget(0); 
                                d.fx = null; d.fy = null; 
                            }))

                            e.stopPropagation(); 
                            setSelectedNode(d);

                                const strat = phaseStrategy[p.id];
                                return (
                                    <div key={idx} className="rounded-[22px] overflow-hidden glass-card transition-all-custom shadow-sm border border-slate-100">
                                        <button 
                                            onClick={() => setActivePhase(isOpen ? null : p.id)}
                                            className={`w-full p-4.5 flex justify-between items-center transition-all ${isOpen ? 'bg-rose-600 text-white shadow-md' : 'bg-white/70 text-slate-700 hover:bg-white/95'}`}
                                        >
                                            <div className="text-left">
                                                <span className={`text-[10px] font-black uppercase tracking-wider block ${isOpen ? 'text-white/70' : 'text-slate-400'}`}>PHASE 0{idx+1}</span>
                                                <span className="text-[15px] font-extrabold">{p.title}</span>
                                            </div>
                                            <span>
                                                {isOpen ? (
                                                    <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M14.707 12.707a1 1 0 01-1.414 0L10 9.414l-3.293 3.293a1 1 0 01-1.414-1.414l4-4a1 1 0 011.414 0l4 4a1 1 0 010 1.414z" clipRule="evenodd" /></svg>
                                                ) : (
                                                    <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clipRule="evenodd" /></svg>
                                                )}
                                            </span>
                                        </button>
                                        
                                        {/* 手風琴滑出面板 */}
                                        {isOpen && strat && (
                                            <div className="p-5 bg-white border-t border-slate-100 space-y-5 text-sm animate-in slide-in-from-top-2 duration-300">
                                                {/* 1. 執行步驟 */}
                                                <div>
                                                    <span className="text-[11px] text-rose-500 font-extrabold uppercase tracking-wider block mb-2.5">▼ 關鍵執行步驟</span>
                                                    <ol className="space-y-2.5 list-decimal list-inside text-slate-700 leading-relaxed pl-1 text-[13.5px]">
                                                        {strat.steps.map((step, sIdx) => (
                                                            <li key={sIdx} className="pl-1 text-slate-700 font-medium">{step}</li>
                                                        ))}
                                                    </ol>
                                                </div>
                                                
                                                {/* 2. 核心關聯節點 */}
                                                <div className="pt-3 border-t border-slate-100">
                                                    <span className="text-[11px] text-emerald-600 font-extrabold uppercase tracking-wider block mb-2.5">● 核心關聯節點 (點擊圖譜對焦)</span>
                                                    <div className="flex flex-wrap gap-2 pl-1">
                                                        {data.nodes
                                                            .filter(n => n.group === p.id && n.source !== '系統定義')
                                                            .map((n, nIdx) => (
                                                                <span 
                                                                    key={nIdx} 
                                                                    onClick={(e) => { e.stopPropagation(); setSelectedNode(n); }}
                                                                    className="bg-slate-100 hover:bg-slate-200 text-slate-800 px-2.5 py-1 rounded-lg text-[12px] border border-slate-200/50 font-bold cursor-pointer transition-colors shadow-sm block"
                                                                >
                                                                    {n.id}
                                                                </span>
                                                            ))
                                                        }
                                                    </div>
                                                </div>
                                                
                                                {/* 3. VRIO 戰略建議 */}
                                                <div className="pt-3 border-t border-slate-100">
                                                    <span className="text-[11px] text-blue-600 font-extrabold uppercase tracking-wider block mb-2">⚡ VRIO 戰略核心建議</span>
                                                    <p className="text-slate-700 leading-relaxed bg-blue-50/80 border border-blue-100 p-3.5 rounded-2xl font-semibold text-[13px] italic">
                                                        "{strat.suggestions}"
                                                    </p>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>

                        {/* 數據統計資訊 */}
                        <div className="mb-6">
                            <div className="p-4.5 bg-white rounded-[20px] border border-slate-100 shadow-sm flex items-center justify-between">
                                <h3 className="text-[12px] font-black text-slate-400 uppercase tracking-widest">當前數據節點量</h3>
                                <p className="text-3xl font-black text-slate-800">
                                    {data?.nodes.filter(n => n.source !== '系統定義').length} 
                                    <span className="text-sm text-slate-400 uppercase ml-1 font-bold">Units</span>
                                </p>
                            </div>
                        </div>

                        {/* 節點詳情卡片 */}
                        {selectedNode ? (
                            <div className="mt-auto p-5.5 bg-white border border-slate-200 shadow-xl rounded-[28px] animate-in fade-in slide-in-from-bottom-6">
                                <h2 className="text-xl font-black text-slate-800 leading-snug tracking-tight">{selectedNode.id}</h2>
                                <div className="flex gap-2 mt-2.5">
                                    <span className="text-[10px] bg-rose-600 text-white px-3 py-1 rounded-full font-black uppercase">
                                        {selectedNode.group.split(':')[0]}
                                    </span>
                                    <span className="text-[10px] bg-blue-600 text-white px-3 py-1 rounded-full font-black uppercase">
                                        比重.{selectedNode.importance}
                                    </span>
                                </div>
                                <div className="mt-4 p-4.5 bg-slate-50 rounded-2xl border border-slate-100">
                                    <p className="text-[13.5px] text-slate-700 leading-relaxed font-bold">
                                        "{selectedNode.desc}"
                                    </p>
                                </div>
                                <div className="mt-4 flex items-center justify-between text-[11px] text-slate-400">
                                    <span className="font-bold">分類：{selectedNode.source}</span>
                                    <button onClick={() => setSelectedNode(null)} className="text-rose-600 hover:underline font-extrabold">清除選擇</button>
                                </div>
                            </div>
                        ) : (
                            <div className="mt-auto p-6 border-2 border-dashed border-slate-200 rounded-[28px] text-center bg-white/40">
                                <p className="text-sm text-slate-400 font-bold leading-relaxed">
                                    💡 點擊上方階段展開「步驟與建議」<br/>或點選圖譜圓球、關聯節點查看細部說明
                                </p>
                            </div>
                        )}
                    </div>

                    {/* 收合按鈕 (浮動明亮粉紅卡片) */}
                    <button 
                        onClick={() => setIsSidebarOpen(!isSidebarOpen)}
                        className={`transition-all-custom fixed top-8 z-30 p-3 bg-rose-600 text-white rounded-full shadow-lg hover:bg-rose-500 ${isSidebarOpen ? 'left-[395px]' : 'left-8'}`}
                    >
                        {isSidebarOpen ? (
                            <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M15 19l-7-7 7-7" /></svg>
                        ) : (
                            <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M4 6h16M4 12h16M4 18h16" /></svg>
                        )}
                    </button>

                    {/* 圖譜渲染畫布 */}
                    <div className="flex-1 relative cursor-crosshair bg-slate-50" onClick={() => setSelectedNode(null)}>
                        <svg ref={svgRef} className="w-full h-full" />
                        
                        {/* 靜態右下角圖例 */}
                        <div className="absolute bottom-6 right-6 flex flex-col gap-2 p-4 bg-white/90 backdrop-blur rounded-2xl border border-slate-200/80 text-[11px] font-bold text-slate-600 shadow-lg">
                            <div className="flex items-center gap-2">
                                <div className="w-2.5 h-2.5 rounded-full bg-[#2563eb]"></div>
                                <span>PHASE 01: 建立學程架構</span>
                            </div>
                            <div className="flex items-center gap-2">
                                <div className="w-2.5 h-2.5 rounded-full bg-[#059669]"></div>
                                <span>PHASE 02: 產學技術對接</span>
                            </div>
                            <div className="flex items-center gap-2">
                                <div className="w-2.5 h-2.5 rounded-full bg-[#db2777]"></div>
                                <span>PHASE 03: 文化內涵深耕</span>
                            </div>
                            <div className="flex items-center gap-2">
                                <div className="w-2.5 h-2.5 rounded-full bg-[#FFA500]"></div>
                                <span>PHASE 04: 培育成果驗收</span>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
